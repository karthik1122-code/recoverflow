<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · RecoverFlow</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="auth.css">
<script src="theme.js"></script>
</head>
<body class="authpage">
<main class="authwrap" id="main">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="18" height="18"><path d="M8 22V10h8a4 4 0 0 1 0 8h-8M15 18l7 4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="brand-word">recover<em>flow</em></span></a>
  <form id="form" class="authcard" novalidate>
    <h1 id="title">Sign in</h1>
    <p id="lede" class="lede">Every decision in the audit log carries the name of the person who made it.</p>
    <div class="f" id="fn" hidden><label for="name">Your name</label><input id="name" maxlength="80" autocomplete="name"></div>
    <div class="f"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
    <div class="f"><label for="password" id="pl">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <div class="f" id="ft" hidden><label for="setupToken">Setup token</label><input id="setupToken" type="password" autocomplete="off"></div>
    <p class="err" id="err" role="alert"></p>
    <button class="btn btn-lime" id="go" type="submit">Sign in</button>
  </form>
  <p class="foot"><a href="/">Back to the overview</a></p>
</main>
<script src="login.js" type="module"></script>
</body>
</html>
