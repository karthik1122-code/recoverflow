<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · RecoverFlow</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="auth.css">
<script src="theme.js"></script>
</head>
<body class="authpage">
<main class="authwrap" id="main">
  <a class="brand" href="/"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#f4a51c"/><path d="M22.6 11.2A8 8 0 1 0 24 16" fill="none" stroke="#131a33" stroke-width="3" stroke-linecap="round"/><path d="M24.4 7.6 23 12l-4.5-1.1" fill="none" stroke="#131a33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="16" r="2.6" fill="#131a33"/></svg><span>RecoverFlow</span></a>
  <form id="form" class="authcard" novalidate>
    <h1 id="title">Sign in</h1>
    <p id="lede" class="lede">Every approval is logged with the name of the person who made it.</p>
    <div class="field" id="fn" hidden><label for="name">Your name</label><input id="name" maxlength="80" autocomplete="name"></div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="password" id="pl">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <div class="field" id="ft" hidden><label for="setupToken">Setup token</label><input id="setupToken" type="password" autocomplete="off"><p class="hint">The SETUP_TOKEN value from your server settings.</p></div>
    <p class="error" id="err" role="alert"></p>
    <button class="btn btn-ink btn-lg" id="go" type="submit">Sign in</button>
  </form>
  <p class="foot"><a href="/">Back to the RecoverFlow site</a></p>
</main>
<script src="login.js" type="module"></script>
</body>
</html>
