<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team · RecoverFlow</title><meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="auth.css">
<script src="theme.js"></script><script src="gate.js"></script>
</head>
<body>
<main class="teampage" id="main">
  <a class="brand" href="/"><svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="1.5" y="1.5" width="25" height="25" rx="7" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M9 19V9h6a3.2 3.2 0 0 1 0 6.4H9M14.5 15.4 19 19" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>RecoverFlow</span></a>
  <h1>Team</h1>
  <p class="lede">Viewers can read everything. Approvers can also send payment links and close cases. Admins can also manage people and connect Razorpay.</p>
  <div class="teamgrid">
    <section class="panel scroll" aria-label="People"><table><thead><tr><th scope="col">Name</th><th scope="col">Email</th><th scope="col">Role</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody id="rows"></tbody></table></section>
    <section class="panel">
      <h2>Add a person</h2>
      <form id="form" novalidate>
        <div class="field"><label for="n">Name</label><input id="n" maxlength="80"></div>
        <div class="field"><label for="e">Email</label><input id="e" type="email"></div>
        <div class="field"><label for="p">Temporary password, 10 or more characters</label><input id="p" type="password" autocomplete="new-password"></div>
        <div class="field"><label for="r">Role</label><select id="r"><option value="viewer">Viewer</option><option value="approver" selected>Approver</option><option value="admin">Admin</option></select></div>
        <p class="error" id="err" role="alert"></p>
        <button class="btn btn-pen" type="submit">Add person</button>
      </form>
    </section>
  </div>
  <p class="foot" style="margin-top:24px"><a href="/app.html">Back to the inbox</a></p>
</main>
<script src="team.js" type="module"></script>
</body>
</html>
