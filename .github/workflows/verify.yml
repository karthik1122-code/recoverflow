name: Verify RecoverFlow

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rf_test
      TEST_DATABASE_URL_LOOP: postgres://postgres:postgres@localhost:5432/rf_loop
      TEST_DATABASE_URL_CASES: postgres://postgres:postgres@localhost:5432/rf_cases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE rf_loop' -c 'CREATE DATABASE rf_cases'
      - run: npm test
      - run: node evaluate.mjs
